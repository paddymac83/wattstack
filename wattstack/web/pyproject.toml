[project]
name = "wattstack-web"
version = "0.1.0"
description = "Local-first Django + HTMX UI for wattstack-core."
requires-python = ">=3.11"
dependencies = [
    "django>=5.0",
    "plotly>=5.20",
    "wattstack-core",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-django>=4.8"]

[tool.uv.sources]
wattstack-core = { path = "../core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wattstack_web", "scenarios"]
