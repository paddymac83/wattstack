[project]
name = "wattstack-ingestion"
version = "0.1.0"
description = "Real GB market data clients (Elexon, NESO) and exploratory plotting -- for planning wattstack features, not part of the optimizer or the web app."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "plotly>=5.20",
    "click>=8.1",
    "marimo>=0.23",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
wattstack-explore = "wattstack_ingestion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wattstack_ingestion"]
